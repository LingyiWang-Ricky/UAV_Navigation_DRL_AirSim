[options]
env_name = SimpleAvoid
dynamic_name = Multirotor

task_type = pursuit_2v1
dual_policy = True
control_role = all
num_uavs = 3
num_pursuers = 2
uav_names = Drone1,Drone2,Drone3
evader_index = 2
catch_distance = 6.0
uav_start_separation = 12.0
pursuit_init_min_dist = 14.0
pursuit_init_max_dist = 30.0
pursuit_curriculum_enable = True
pursuit_curriculum_steps = 300
pursuit_curriculum_start_scale = 0.7
pursuit_opponent_deterministic = True
pursuit_surround_reward_coef = 1.0
pursuit_teammate_too_close_dist = 5.0
pursuit_teammate_too_close_penalty = 1.0
pursuit_progress_coef = 6.0
pursuit_individual_progress_coef = 3.0
pursuit_step_penalty = 0.01
pursuit_near_catch_bonus_coef = 2.0
pursuit_workspace_penalty_max = 1.0
pursuit_intercept_radius = 10.0
pursuit_intercept_radius_gain = 0.8
pursuit_goal_update_interval = 3
pursuit_goal_min_shift = 1.0

navigation_3d = False
using_velocity_state = False
reward_type = reward_final

;depth, lgmd, vector
perception = vector

algo = SAC
total_timesteps = 300000
selfplay_rounds = 20
selfplay_steps_per_round = 15000

policy_name = mlp
net_arch = [64, 32, 16]
activation_function = tanh
cnn_feature_num = 5

keyboard_debug = False
generate_q_map = False
q_map_save_steps = 10000

use_wandb = False

[wandb]
name = Pursuit-2v1-SAC
notes = pursuit task

[environment]
max_depth_meters = 15
screen_height = 60
screen_width = 90

crash_distance = 2
accept_radius = 2

[multirotor]
dt = 0.1
acc_xy_max = 2.0
v_xy_max = 5
v_xy_min = 0.5
v_z_max = 2.0
yaw_rate_max_deg = 30.0

[DRL]
gamma = 0.99
learning_rate = 1e-3
learning_starts = 2000
buffer_size = 50000
batch_size = 512
train_freq = 100
gradient_steps = 100
action_noise_sigma = 0.1
ent_coef = auto_0.1
target_entropy = -2
