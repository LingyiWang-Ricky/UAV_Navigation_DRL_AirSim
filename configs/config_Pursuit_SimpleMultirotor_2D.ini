[options]
env_name = SimpleAvoid
dynamic_name = Multirotor

task_type = pursuit_2v1
dual_policy = True
control_role = all
num_uavs = 3
uav_names = Drone1,Drone2,Drone3
evader_index = 2
catch_distance = 8.0
uav_start_separation = 10.0
pursuit_obstacle_penalty_weight = 0.6
pursuit_safe_depth_m = 8.0
pursuit_boundary_penalty_weight = 0.8
pursuit_boundary_safe_margin = 8.0
pursuit_out_penalty = 300.0
pursuit_use_visibility_reward_gate = True
pursuit_visibility_half_fov_deg = 55.0
pursuit_safety_shield = True
pursuit_shield_depth_m = 3.5
pursuit_shield_min_scale = 0.45
pursuit_use_safe_mask = True
pursuit_safe_mask_depth_m = 2.8
pursuit_safe_mask_boundary_margin = 4.0
pursuit_reset_min_depth_m = 3.5

navigation_3d = False
using_velocity_state = False
reward_type = reward_final

;depth, lgmd, vector
perception = depth

algo = SAC
total_timesteps = 500000
selfplay_rounds = 20
selfplay_steps_per_round = 20000

policy_name = mlp
net_arch = [64, 32, 16]
activation_function = tanh
cnn_feature_num = 25

keyboard_debug = False
generate_q_map = False
q_map_save_steps = 10000

use_wandb = False

[wandb]
name = Pursuit-2v1-SAC
notes = pursuit task

[environment]
max_depth_meters = 15
screen_height = 60
screen_width = 90
max_episode_steps = 1500

crash_distance = 2
accept_radius = 2

[multirotor]
dt = 0.1
acc_xy_max = 2.0
v_xy_max = 3.0
v_xy_min = 0.3
v_z_max = 2.0
yaw_rate_max_deg = 20.0

[DRL]
gamma = 0.99
learning_rate = 3e-4
learning_starts = 2000
buffer_size = 50000
batch_size = 512
train_freq = 100
gradient_steps = 100
action_noise_sigma = 0.03
ent_coef = 0.05
target_entropy = -2
